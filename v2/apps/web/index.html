<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EU Trade Chat — v2</title>
<style>
  :root { --bg:#0f1419; --panel:#1a212b; --ink:#e6edf3; --muted:#8b98a5; --accent:#4493f8; --line:#2a3441; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:16px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; font-weight:600; }
  header .sub { color:var(--muted); font-size:13px; }
  .controls { margin-left:auto; display:flex; align-items:center; gap:14px; font-size:13px; color:var(--muted); }
  select { background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:5px 8px; }
  main { max-width:860px; margin:0 auto; padding:18px; }
  #chat { display:flex; flex-direction:column; gap:14px; min-height:50vh; }
  .msg { padding:12px 14px; border-radius:10px; line-height:1.5; font-size:14.5px; max-width:88%; }
  .user { align-self:flex-end; background:var(--accent); color:#fff; }
  .bot { align-self:flex-start; background:var(--panel); border:1px solid var(--line); white-space:pre-wrap; }
  .bot .row { margin:3px 0; }
  .tag { font-weight:600; }
  .err { color:#f0883e; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:14px 0; }
  .chip { background:var(--panel); border:1px solid var(--line); color:var(--muted); border-radius:16px; padding:6px 12px; font-size:12.5px; cursor:pointer; }
  .chip:hover { color:var(--ink); border-color:var(--accent); }
  form { display:flex; gap:10px; margin-top:16px; position:sticky; bottom:18px; }
  input[type=text] { flex:1; background:var(--panel); border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:12px 14px; font-size:14.5px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:0 18px; font-size:14.5px; cursor:pointer; }
  .legend { color:var(--muted); font-size:12px; margin-top:8px; }
</style>
</head>
<body>
<header>
  <h1>🌍 EU Trade Chat</h1>
  <span class="sub">code computes the numbers · the model only explains</span>
  <div class="controls">
    <label><input type="checkbox" id="useLLM"> use LLM</label>
    <select id="model"></select>
  </div>
</header>
<main>
  <div class="chips" id="chips"></div>
  <div id="chat"></div>
  <form id="form">
    <input type="text" id="q" placeholder="Ask about EU trade… e.g. France's highest export month?" autocomplete="off">
    <button>Ask</button>
  </form>
  <div class="legend">🔢 computed (exact) · 📚 retrieved context · 🧠 inferred · 💬 LLM phrasing</div>
</main>
<script>
const chat = document.getElementById('chat');
const chips = document.getElementById('chips');
const modelSel = document.getElementById('model');

function add(cls, html){ const d=document.createElement('div'); d.className='msg '+cls; d.innerHTML=html; chat.appendChild(d); d.scrollIntoView({behavior:'smooth'}); return d; }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

async function init(){
  const sug = await (await fetch('/api/suggestions')).json();
  sug.forEach(s => { const c=document.createElement('div'); c.className='chip'; c.textContent=s; c.onclick=()=>{document.getElementById('q').value=s; ask();}; chips.appendChild(c); });
  const m = await (await fetch('/api/models')).json();
  if(m.available && m.models.length){ m.models.forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=x;modelSel.appendChild(o);}); }
  else { const o=document.createElement('option'); o.textContent='(Ollama off)'; modelSel.appendChild(o); modelSel.disabled=true; document.getElementById('useLLM').disabled=true; }
}

async function ask(){
  const q = document.getElementById('q').value.trim(); if(!q) return;
  add('user', esc(q)); document.getElementById('q').value='';
  const thinking = add('bot', '…');
  const r = await (await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({question:q, use_llm:document.getElementById('useLLM').checked, model:modelSel.value})})).json();
  let html='';
  if(r.error){ html='<span class="err">⚠️ '+esc(r.error)+'</span>'; }
  else {
    html += '<div class="row"><span class="tag">🔢</span> '+esc(r.computed)+'</div>';
    (r.context||[]).forEach(c => html += '<div class="row"><span class="tag">📚</span> '+esc(c)+'</div>');
    if(r.inferred) html += '<div class="row"><span class="tag">🧠</span> '+esc(r.inferred)+'</div>';
    if(r.phrased)  html += '<div class="row"><span class="tag">💬</span> '+esc(r.phrased)+'</div>';
  }
  thinking.innerHTML = html;
}

document.getElementById('form').addEventListener('submit', e=>{e.preventDefault(); ask();});
init();
</script>
</body>
</html>
