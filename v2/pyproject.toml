[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "time-series-hci-v2"
version = "1.0.0"
description = "Verifiable natural-language time-series analytics (EU trade) — code computes exact numbers, a local LLM only explains them."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

# Abstract dependencies (lower bounds). The exact pin set lives in requirements.txt.
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "flask>=3.0",
]

[project.optional-dependencies]
# Deep detectors (dense AE + LSTM-AE/CNN-AE/TCN-AE). On the RTX 5070 use the pinned CUDA
# build in requirements.txt; on CPU: pip install torch --index-url .../whl/cpu
deep = ["torch>=2.4"]
# Neural (BERT) retriever, alongside the offline BM25/LSA methods:
advanced = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

# Flat single-package layout, matching v1/v3: modules live in src/, imported as `src.*`.
[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks", "report"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tools/*" = ["E402"]

[tool.mypy]
# Lightweight, non-strict static typing on the source layer, matching v1/v3's config exactly.
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = false
disable_error_code = ["var-annotated", "assignment", "arg-type", "index", "union-attr", "attr-defined", "operator", "return-value", "call-overload"]
