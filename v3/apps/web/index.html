<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DAD — Data-Center IoT Network Q&A</title>
<style>
  :root { color-scheme: light dark; --bg:#0f1117; --card:#1a1d27; --fg:#e8eaf0; --mut:#9aa3b2;
          --accent:#4f7cff; --amber:#e07a34; --red:#d9534f; --line:#2a2f3d; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.55 system-ui, sans-serif; background:var(--bg); color:var(--fg);
         display:flex; flex-direction:column; height:100vh; }
  header { padding:12px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center;
           justify-content:space-between; gap:12px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:16px; }
  header .sub { color:var(--mut); font-size:12px; }
  .controls { display:flex; align-items:center; gap:14px; font-size:13px; }
  .status { display:flex; align-items:center; gap:6px; color:var(--mut); }
  .dot { width:9px; height:9px; border-radius:50%; background:#6b7280; }
  .dot.on { background:#3ec46d; }
  .toggle { display:flex; align-items:center; gap:6px; cursor:pointer; }
  #examples { display:flex; flex-wrap:wrap; gap:6px; padding:10px 18px; border-bottom:1px solid var(--line); }
  .chip { background:var(--card); border:1px solid var(--line); color:var(--fg); border-radius:14px;
          padding:5px 10px; font-size:12px; cursor:pointer; }
  .chip:hover { border-color:var(--accent); }
  #log { flex:1; overflow-y:auto; padding:16px 18px; }
  .msg { max-width:780px; margin:0 auto 14px; }
  .you { text-align:right; }
  .you .b { background:var(--accent); color:#fff; }
  .b { display:inline-block; background:var(--card); border:1px solid var(--line); border-radius:12px;
       padding:9px 13px; text-align:left; max-width:100%; }
  .fact { color:var(--mut); font-size:13px; margin-top:5px; }
  .chartwrap { margin-top:10px; background:#0c0e14; border:1px solid var(--line); border-radius:8px; padding:8px; }
  .charttitle { font-size:12px; color:var(--mut); margin-bottom:4px; }
  svg.chart { width:100%; height:auto; display:block; }
  footer { display:flex; gap:8px; padding:12px 18px; border-top:1px solid var(--line); max-width:820px;
           margin:0 auto; width:100%; }
  #q { flex:1; background:var(--card); border:1px solid var(--line); color:var(--fg); border-radius:10px;
       padding:10px 12px; font-size:15px; }
  button.send { background:var(--accent); color:#fff; border:0; border-radius:10px; padding:10px 16px; cursor:pointer; }
</style>
</head>
<body>
  <header>
    <div>
      <h1>🛰️ DAD — Data-Center IoT Network</h1>
      <div class="sub">Every number is computed by code; the AI (optional) only rewords it.</div>
    </div>
    <div class="controls">
      <span class="status"><span id="lamp" class="dot"></span><span id="statustext">checking AI…</span></span>
      <label class="toggle"><input id="aitoggle" type="checkbox" disabled><span>Explain with AI</span></label>
    </div>
  </header>
  <nav id="examples"></nav>
  <main id="log"></main>
  <footer>
    <input id="q" autocomplete="off" placeholder="e.g. how many attacks on Wednesday?">
    <button class="send" onclick="ask()">Ask</button>
  </footer>
<script>
const log = document.getElementById('log'), qbox = document.getElementById('q');
const aitoggle = document.getElementById('aitoggle');
function esc(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function bubble(cls, html){ const d=document.createElement('div'); d.className='msg '+cls;
  d.innerHTML='<span class="b">'+html+'</span>'; log.appendChild(d); log.scrollTop=log.scrollHeight; }

// ---- tiny SVG chart renderer (presentation only; numbers already computed) ----
function drawChart(c){
  if(!c || !c.y || !c.y.length) return '';
  const W=560, H=170, pad=28, iw=W-pad*2, ih=H-pad*2;
  const ymax = Math.max(...c.y, 1), n=c.y.length;
  let body='';
  if(c.kind==='bar'){
    const bw = iw/n*0.7, gap = iw/n;
    c.y.forEach((v,i)=>{
      const h = ih*(v/ymax), x = pad+i*gap+(gap-bw)/2, y = pad+ih-h;
      const hot = c.highlight && c.x[i]===c.highlight;
      body += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${hot?'#e07a34':'#4f7cff'}"/>`;
      body += `<text x="${(x+bw/2).toFixed(1)}" y="${(y-3).toFixed(1)}" fill="#9aa3b2" font-size="9" text-anchor="middle">${v}</text>`;
      body += `<text x="${(x+bw/2).toFixed(1)}" y="${H-8}" fill="#9aa3b2" font-size="9" text-anchor="middle">${esc(String(c.x[i]))}</text>`;
    });
  } else { // line
    const pts = c.y.map((v,i)=>{ const x=pad+iw*(n<2?0:i/(n-1)); const y=pad+ih-ih*(v/ymax); return `${x.toFixed(1)},${y.toFixed(1)}`; });
    body += `<polyline points="${pts.join(' ')}" fill="none" stroke="#4f7cff" stroke-width="1.6"/>`;
    body += `<text x="${pad}" y="${pad-8}" fill="#9aa3b2" font-size="9">${esc(c.ylabel||'')} max ${ymax}</text>`;
    body += `<text x="${pad}" y="${H-8}" fill="#9aa3b2" font-size="9">${esc((c.x[0]||'').slice(0,16))}</text>`;
    body += `<text x="${W-pad}" y="${H-8}" fill="#9aa3b2" font-size="9" text-anchor="end">${esc((c.x[n-1]||'').slice(0,16))}</text>`;
  }
  return `<div class="chartwrap"><div class="charttitle">📊 ${esc(c.title||'')}</div>`+
         `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${body}</svg></div>`;
}

async function ask(text){
  const q = (text||qbox.value).trim(); if(!q) return; qbox.value='';
  bubble('you', esc(q));
  try {
    const r = await fetch('/api/ask', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({question:q, use_llm: aitoggle.checked})});
    const d = await r.json();
    if(d.error){ bubble('bot', '⚠️ '+esc(d.error)); return; }
    let h = '🔢 '+esc(d.text);
    if(d.used_llm) h += '<div class="fact">reworded by local AI — numbers verified against the data</div>';
    if(d.context) h += '<div class="fact">📚 '+esc(d.context)+'</div>';
    if(d.inferred) h += '<div class="fact">🧠 '+esc(d.inferred)+'</div>';
    h += drawChart(d.chart);
    bubble('bot', h);
  } catch(e){ bubble('bot', '⚠️ '+esc(String(e))); }
}
qbox.addEventListener('keydown', e => { if(e.key==='Enter') ask(); });

fetch('/api/examples').then(r=>r.json()).then(d=>{
  const nav=document.getElementById('examples');
  (d.examples||[]).forEach(x=>{ const b=document.createElement('button'); b.className='chip';
    b.textContent=x; b.onclick=()=>ask(x); nav.appendChild(b); });
});
// AI availability: enable the toggle only if a local Ollama model is reachable.
fetch('/api/models').then(r=>r.json()).then(d=>{
  const lamp=document.getElementById('lamp'), st=document.getElementById('statustext');
  if(d.available && (d.models||[]).length){ lamp.classList.add('on'); st.textContent='AI ready ('+d.models.length+' model'+(d.models.length>1?'s':'')+')'; aitoggle.disabled=false; }
  else { st.textContent='AI off — exact answers'; aitoggle.disabled=true; }
}).catch(()=>{ document.getElementById('statustext').textContent='AI off — exact answers'; });
</script>
</body>
</html>
