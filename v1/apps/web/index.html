<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Time-Series HCI</title>
<style>
  :root { --bg:#0f1419; --panel:#1a2230; --accent:#4f9cf9; --text:#e6edf3; --muted:#8b97a7;
          --good:#3fb950; --chip:#243044; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
  header { padding:14px 20px; background:var(--panel); border-bottom:1px solid #2a3548;
           display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; }
  header .sub { color:var(--muted); font-size:12px; }
  .controls { margin-left:auto; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  select { background:var(--chip); color:var(--text); border:1px solid #2a3548; border-radius:6px;
           padding:6px 8px; font-size:13px; }
  label.toggle { display:flex; align-items:center; gap:6px; font-size:13px; cursor:pointer; }
  .status { font-size:12px; color:var(--muted); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#555; margin-right:5px; }
  .dot.on { background:var(--good); }
  #chips { padding:12px 20px; display:flex; gap:8px; flex-wrap:wrap; border-bottom:1px solid #2a3548; }
  .chip { background:var(--chip); border:1px solid #2a3548; color:var(--text); border-radius:16px;
          padding:6px 12px; font-size:12.5px; cursor:pointer; }
  .chip:hover { border-color:var(--accent); }
  #chat { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:14px; }
  .msg { max-width:760px; }
  .msg.user { align-self:flex-end; }
  .bubble { padding:11px 14px; border-radius:12px; line-height:1.5; font-size:14.5px; }
  .user .bubble { background:var(--accent); color:#04121f; border-bottom-right-radius:3px; }
  .bot .bubble { background:var(--panel); border:1px solid #2a3548; border-bottom-left-radius:3px; }
  .answer { font-size:15px; }
  .facts { margin-top:9px; padding-top:9px; border-top:1px dashed #2a3548; font-size:12.5px; color:var(--muted); }
  .facts div { margin:2px 0; }
  .meta { font-size:11px; color:var(--muted); margin-top:6px; }
  .err { color:#ff7b72; }
  footer { padding:14px 20px; background:var(--panel); border-top:1px solid #2a3548; display:flex; gap:10px; }
  #q { flex:1; background:var(--chip); border:1px solid #2a3548; color:var(--text); border-radius:8px;
       padding:11px 14px; font-size:14.5px; }
  #send { background:var(--accent); color:#04121f; border:none; border-radius:8px; padding:0 20px;
          font-size:14.5px; font-weight:600; cursor:pointer; }
  #send:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<header>
  <div>
    <h1>🌡️ Time-Series HCI</h1>
    <div class="sub" id="dsinfo">Jena Climate · loading…</div>
  </div>
  <div class="controls">
    <span class="status"><span class="dot" id="lamp"></span><span id="ollamaStatus">checking Ollama…</span></span>
    <label class="toggle"><input type="checkbox" id="useLlm"/> Use LLM</label>
    <select id="model" disabled><option>template</option></select>
  </div>
</header>

<div id="chips"></div>
<div id="chat"></div>

<footer>
  <input id="q" placeholder="Ask about the data… e.g. 'what was the hottest temperature?'" autocomplete="off"/>
  <button id="send">Ask</button>
</footer>

<script>
const chat = document.getElementById('chat');
const qInput = document.getElementById('q');
const sendBtn = document.getElementById('send');
const useLlm = document.getElementById('useLlm');
const modelSel = document.getElementById('model');

function esc(s){ return (s||'').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function addUser(text){
  const m = document.createElement('div'); m.className='msg user';
  m.innerHTML = `<div class="bubble">${esc(text)}</div>`;
  chat.appendChild(m); chat.scrollTop = chat.scrollHeight;
}
function addBot(data){
  const m = document.createElement('div'); m.className='msg bot';
  if (data.error){
    m.innerHTML = `<div class="bubble err">⚠️ ${esc(data.error)}</div>`;
  } else {
    let facts = '';
    if (data.computed) facts += `<div>🔢 <b>Computed:</b> ${esc(data.computed)}</div>`;
    if (data.context)  facts += `<div>📚 <b>Context:</b> ${esc(data.context)}</div>`;
    if (data.inferred) facts += `<div>🧠 <b>Inferred:</b> ${esc(data.inferred)}</div>`;
    const meta = `intent: ${esc(data.intent||'—')} · ${data.used_llm?'LLM phrasing':'template'}`;
    m.innerHTML = `<div class="bubble"><div class="answer">${esc(data.text)}</div>`+
                  (facts?`<div class="facts">${facts}</div>`:'')+
                  `<div class="meta">${meta}</div></div>`;
  }
  chat.appendChild(m); chat.scrollTop = chat.scrollHeight;
}

async function ask(text){
  if(!text) return;
  addUser(text); qInput.value=''; sendBtn.disabled=true;
  const thinking = document.createElement('div'); thinking.className='msg bot';
  thinking.innerHTML='<div class="bubble">…</div>'; chat.appendChild(thinking);
  try{
    const r = await fetch('/api/ask', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({question:text, use_llm:useLlm.checked, model:modelSel.value})});
    const data = await r.json();
    thinking.remove(); addBot(data);
  }catch(e){ thinking.remove(); addBot({error:String(e)}); }
  sendBtn.disabled=false; qInput.focus();
}

sendBtn.onclick = ()=>ask(qInput.value.trim());
qInput.addEventListener('keydown', e=>{ if(e.key==='Enter') ask(qInput.value.trim()); });

// init
fetch('/api/suggestions').then(r=>r.json()).then(d=>{
  document.getElementById('dsinfo').textContent =
    `Jena Climate · ${d.sensors.length} sensors`;
  const chips = document.getElementById('chips');
  d.suggestions.forEach(s=>{
    const c=document.createElement('div'); c.className='chip'; c.textContent=s;
    c.onclick=()=>ask(s); chips.appendChild(c);
  });
});
fetch('/api/models').then(r=>r.json()).then(d=>{
  const lamp=document.getElementById('lamp'), st=document.getElementById('ollamaStatus');
  if(d.available && d.models.length){
    lamp.classList.add('on'); st.textContent='Ollama ready';
    modelSel.disabled=false; modelSel.innerHTML='';
    d.models.forEach(name=>{ const o=document.createElement('option');
      o.value=name; o.textContent=name.length>40?name.slice(0,40)+'…':name; modelSel.appendChild(o); });
  } else {
    st.textContent='Ollama off (template only)'; useLlm.checked=false; useLlm.disabled=true;
  }
});
</script>
</body>
</html>
