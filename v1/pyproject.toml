[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "time-series-hci-v1"
version = "1.0.0"
description = "Verifiable natural-language time-series analytics (Jena climate) — code computes exact numbers, a local LLM only explains them."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

# Abstract dependencies (lower bounds). The exact, reproducible pin set — including the
# CUDA 12.8 torch build for the RTX 5070 — lives in requirements.txt; install that for an
# environment identical to the tested one:  pip install -r requirements.txt
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "flask>=3.0",
]

[project.optional-dependencies]
# Deep detectors (CNN-AE, LSTM-AE, LSTM-forecaster). On the RTX 5070 use the pinned
# CUDA build in requirements.txt; on CPU:  pip install torch --index-url .../whl/cpu
deep = ["torch>=2.4"]
# Optional retrieval/detection extras (baselines & advanced methods; core runs without them):
#   BM25 baseline, dense sentence-transformer retriever, Matrix-Profile discord detector.
advanced = ["rank-bm25>=0.2", "sentence-transformers>=3.0", "stumpy>=1.12"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

# Flat single-package layout: the 13 modules live in src/, imported as `src.*`
# (kept flat deliberately — notebooks, apps, tests and the report all import `from src import …`).
[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the project root on sys.path so `from src import …` resolves when running pytest
# from here or from the repository root — replaces the old conftest.py bootstrap.
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks", "report"]

[tool.ruff.lint]
# Conservative, high-signal rules: pyflakes (F), pycodestyle (E/W), import order (I),
# bugbear (B), and modern-Python upgrades (UP). E501 (line length) is handled above.
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Apps bootstrap sys.path before importing `src`, so their imports are intentionally
# not at the top of the file.
"apps/*" = ["E402"]

[tool.mypy]
# Lightweight, non-strict static typing on the source layer — a rigour signal that catches
# obvious type mismatches without demanding a full annotation pass on numeric/pandas-heavy
# code. Third-party stubs (pandas, sklearn, statsmodels, torch) are not required.
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = false
# attr-defined/union-attr are disabled because the interface deliberately reuses a local across
# Extremum/dict query results and carries a dynamic `value: object` field on Answer.
disable_error_code = ["var-annotated", "assignment", "arg-type", "index", "union-attr", "attr-defined", "operator", "return-value", "call-overload"]
